name: Deploy Docusaurus naar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v7

      - name: Node.js instellen
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Dependencies installeren
        # Papersaurus bevat een foutieve preinstall-check die npm weigert,
        # hoewel npm in de officiële package-instructies ondersteund wordt.
        run: npm ci --ignore-scripts

      - name: Docusaurus bouwen
        run: npm run build

      - name: GitHub Pages configureren
        uses: actions/configure-pages@v6

      - name: Website uploaden
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publiceren op GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
